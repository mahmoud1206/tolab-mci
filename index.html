<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#071124" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="طلاب MCI" />
  <title>طلاب MCI — الفرقة الأولى • دفعة 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * {
      font-family: 'Cairo', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #f4f6f9;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .clean-card {
      background: #ffffff;
      border: 1px solid #e5e9f0;
      box-shadow: 0 4px 18px -10px rgba(15, 23, 42, 0.07);
    }

    .choice-btn {
      transition: transform 0.14s ease, border-color 0.14s ease, background-color 0.14s ease;
    }

    .choice-btn:active:not(:disabled) {
      transform: scale(0.99);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="antialiased selection:bg-amber-200 selection:text-slate-950">

  <!-- =====================================================================
       الهيدر العلوي المنظم + شريط التنقل
  ====================================================================== -->
  <header class="sticky top-0 z-40 bg-[#071124] text-white border-b border-white/10">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between gap-2.5">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-9 h-9 rounded-xl bg-amber-400 text-slate-950 font-black text-xs flex items-center justify-center shrink-0">
          MCI
        </div>
        <div class="min-w-0">
          <div class="text-sm sm:text-base font-black text-white truncate">
            طلاب MCI • دفعة 2026
          </div>
          <div class="text-[11px] text-slate-300 font-semibold truncate">
            الفرقة الأولى • MCI Academy بالتجمع الأول
          </div>
        </div>
      </div>

      <div class="flex items-center gap-1.5 shrink-0">
        <button
          type="button"
          id="refresh-db-btn"
          class="px-2.5 py-1.5 rounded-xl text-xs font-extrabold bg-white/10 hover:bg-white/20 text-slate-100 transition cursor-pointer"
          title="تحديث البيانات"
        >
          🔄
        </button>

        <a
          href="https://whatsapp.com/channel/0029VbDoAyV1t90Xere28X0B"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex items-center gap-1 px-3 py-1.5 rounded-xl text-xs font-black bg-emerald-600 hover:bg-emerald-500 text-white transition"
        >
          <span>قناة الواتس</span>
          <span aria-hidden="true">↗</span>
        </a>
      </div>
    </div>

    <!-- شريط التنقل الرئيسي -->
    <nav class="bg-[#0b1931] border-t border-white/10">
      <div class="max-w-4xl mx-auto px-3 py-2 flex items-center gap-1.5 overflow-x-auto no-scrollbar" id="main-nav">
        <button type="button" data-tab="alerts" class="nav-tab shrink-0 px-3 py-1.5 rounded-xl text-xs font-extrabold transition cursor-pointer">
          🔔 التنبيهات
        </button>
        <button type="button" data-tab="lectures" class="nav-tab shrink-0 px-3 py-1.5 rounded-xl text-xs font-extrabold transition cursor-pointer">
          📚 المحاضرات
        </button>
        <button type="button" data-tab="assignments" class="nav-tab shrink-0 px-3 py-1.5 rounded-xl text-xs font-extrabold transition cursor-pointer">
          📝 التكليفات
        </button>
        <button type="button" data-tab="weekly" class="nav-tab shrink-0 px-3 py-1.5 rounded-xl text-xs font-extrabold transition cursor-pointer">
          🎯 أسئلة الأسبوع
        </button>
        <button type="button" data-tab="midterm" class="nav-tab shrink-0 px-3 py-1.5 rounded-xl text-xs font-extrabold transition cursor-pointer">
          🎓 الفاينل والميدتيرم
        </button>
      </div>
    </nav>

    <!-- شريط تقدم الاختبار (يظهر فقط أثناء حل اختبار أسبوعي) -->
    <div id="quiz-progress-strip" class="hidden bg-[#102447] border-t border-white/10">
      <div class="max-w-4xl mx-auto px-4 py-2">
        <div class="flex items-center justify-between text-xs font-bold text-slate-200 mb-1">
          <span id="progress-label">تمت الإجابة على 0 من 0</span>
          <span id="progress-pct" class="text-amber-300 font-black">0%</span>
        </div>
        <div class="w-full h-1.5 bg-white/10 rounded-full overflow-hidden">
          <div id="progress-bar" class="h-full bg-amber-400 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- إشعار تنبيهي خفيف -->
  <div id="toast-box" class="fixed bottom-5 left-4 right-4 sm:left-auto sm:right-6 z-50 hidden max-w-sm">
    <div class="bg-[#071124] text-white border border-amber-400/50 rounded-2xl px-4 py-3 shadow-xl flex items-center justify-between gap-3">
      <p id="toast-msg" class="text-xs font-bold leading-relaxed"></p>
      <button type="button" id="toast-close" class="text-amber-300 hover:text-white font-black text-xs shrink-0 cursor-pointer">
        ✕
      </button>
    </div>
  </div>

  <!-- =====================================================================
       المحتوى الرئيسي
  ====================================================================== -->
  <main id="app-root" class="flex-1 w-full max-w-4xl mx-auto px-4 py-5 space-y-4"></main>

  <!-- =====================================================================
       تنويه الاستقلالية + الفوتر
  ====================================================================== -->
  <footer class="bg-[#071124] text-slate-300 border-t border-white/10 mt-6">
    <div class="max-w-4xl mx-auto px-4 py-2.5 border-b border-white/10 text-[11px] text-slate-300 text-center font-semibold leading-relaxed">
      تنويه: منصة «طلاب MCI» مبادرة طلابية مستقلة لخدمة طلاب الفرقة الأولى — دفعة 2026، وغير تابعة رسمياً لإدارة المعهد.
    </div>
    <div class="max-w-4xl mx-auto px-4 py-3.5 flex flex-col sm:flex-row items-center justify-between gap-1.5 text-xs font-bold text-center">
      <div>
        حقوق تصميم الموقع للطالب <span class="text-amber-300 font-black">محمود احمد</span>
      </div>
      <div dir="ltr" class="text-slate-200 font-extrabold">
        01289139880
      </div>
    </div>
  </footer>

  <script>
    // =====================================================================
    // 1. إعدادات الاتصال بـ Supabase والثوابت
    // =====================================================================
    const SUPABASE_URL = "https://rspibcrdzccmtypewkul.supabase.co";
    const SUPABASE_KEY = "sb_publishable_EAqDKk3U8UpZ2VCO9itiwQ_qpYHigKF";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const FINALS_DATE_ISO = "2027-01-02T00:00:00";
    const SAVED_BRANCH_KEY = "mci_student_branch_2026";
    const HIDE_IOS_TIP_KEY = "mci_hide_ios_tip_2026";

    const SUBJECTS_LIST = [
      { id: "all", name: "كل المواد" },
      { id: "english", name: "مبادئ إنجليزي" },
      { id: "economics", name: "مبادئ اقتصاد" },
      { id: "accounting", name: "مبادئ محاسبة مالية" },
      { id: "mgmt", name: "مبادئ إدارة أعمال" },
      { id: "law", name: "مبادئ قانون" },
      { id: "politics", name: "مبادئ علوم سياسية" }
    ];

    const BRANCHES_LIST = [
      { id: "all", name: "كل الشُعب" },
      { id: "mis", name: "نظم معلومات إدارية" },
      { id: "acc", name: "محاسبة" },
      { id: "mkt", name: "تسويق" }
    ];

    const TASK_TYPES_LIST = [
      { id: "all", name: "الكل" },
      { id: "شيت", name: "شيت" },
      { id: "بحث", name: "بحث" },
      { id: "مناقشة", name: "مناقشة" }
    ];

    function getSavedBranch() {
      const val = localStorage.getItem(SAVED_BRANCH_KEY);
      return BRANCHES_LIST.some((b) => b.id === val) ? val : "all";
    }

    function savePreferredBranch(branchId) {
      localStorage.setItem(SAVED_BRANCH_KEY, branchId);
      state.lectureBranch = branchId;
      state.assignBranch = branchId;
    }

    const liveStore = {
      loading: true,
      error: null,
      alerts: [],
      lectures: [],
      assignments: [],
      weeklyQuizzes: []
    };

    const initialBranch = getSavedBranch();

    const state = {
      activeTab: "alerts",
      lectureSubject: "all",
      lectureBranch: initialBranch,
      assignBranch: initialBranch,
      assignSubject: "all",
      assignType: "all",
      alertSubject: "all",
      quizSource: null,
      quizView: "setup",
      selectedWeeklyId: "",
      questions: [],
      currentIdx: 0,
      answers: {},
      locked: {},
      gradingMode: "end",
      resultFilter: "all"
    };

    const appEl = document.getElementById("app-root");
    const progressStrip = document.getElementById("quiz-progress-strip");
    const progressLabel = document.getElementById("progress-label");
    const progressPct = document.getElementById("progress-pct");
    const progressBar = document.getElementById("progress-bar");

    let toastTimer = null;
    function showToast(msg) {
      const box = document.getElementById("toast-box");
      const text = document.getElementById("toast-msg");
      if (!box || !text) return;
      text.textContent = msg;
      box.classList.remove("hidden");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => box.classList.add("hidden"), 2800);
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function getSubjectName(id) {
      const found = SUBJECTS_LIST.find((s) => s.id === id);
      return found ? found.name : id;
    }

    function getBranchName(id) {
      const found = BRANCHES_LIST.find((b) => b.id === id);
      return found ? found.name : id;
    }

    // =====================================================================
    // 2. جلب البيانات من Supabase
    // =====================================================================
    async function loadFromSupabase(notify = false) {
      liveStore.loading = true;
      liveStore.error = null;
      render();

      try {
        const [alertsRes, lecturesRes, assignmentsRes, weeklyRes] = await Promise.all([
          sb.from("alerts").select("*").order("created_at", { ascending: false }),
          sb.from("lectures").select("*").order("created_at", { ascending: false }),
          sb.from("assignments").select("*").order("created_at", { ascending: false }),
          sb.from("weekly_questions").select("*").order("created_at", { ascending: true })
        ]);

        if (alertsRes.error) throw alertsRes.error;
        if (lecturesRes.error) throw lecturesRes.error;
        if (assignmentsRes.error) throw assignmentsRes.error;
        if (weeklyRes.error) throw weeklyRes.error;

        liveStore.alerts = alertsRes.data || [];
        liveStore.lectures = lecturesRes.data || [];
        liveStore.assignments = assignmentsRes.data || [];

        const groupedMap = new Map();
        (weeklyRes.data || []).forEach((row) => {
          const label = row.week_label || "أسئلة أسبوعية";
          if (!groupedMap.has(label)) {
            groupedMap.set(label, {
              id: label,
              title: label,
              subtitle: "تجميعة أسئلة المراجعة الأسبوعية",
              questions: []
            });
          }
          const pack = groupedMap.get(label);
          const opts = Array.isArray(row.options) ? row.options : ["صح", "خطأ"];
          pack.questions.push({
            id: `wq-${row.id}`,
            section: row.section || "mcq",
            number: pack.questions.length + 1,
            subjectId: row.subject_id || "all",
            question: `[${getSubjectName(row.subject_id)}] ${row.question_text}`,
            options: opts,
            correctAnswer: row.correct_answer,
            explanation: row.explanation || ""
          });
        });

        liveStore.weeklyQuizzes = Array.from(groupedMap.values()).reverse();
        if (liveStore.weeklyQuizzes.length > 0 && !groupedMap.has(state.selectedWeeklyId)) {
          state.selectedWeeklyId = liveStore.weeklyQuizzes[0].id;
        }

        liveStore.loading = false;
        if (notify) showToast("تم التحديث ✓");
      } catch (err) {
        console.error("Supabase error:", err);
        liveStore.loading = false;
        liveStore.error = err.message || "تعذر الاتصال بقاعدة البيانات حالياً.";
        if (notify) showToast("تعذر التحديث الآن");
      }

      render();
    }

    // =====================================================================
    // 3. عناصر الواجهة المشتركة (مرتبة وخفيفة على الموبايل)
    // =====================================================================
    function updateNavTabs() {
      document.querySelectorAll(".nav-tab").forEach((btn) => {
        const tab = btn.getAttribute("data-tab");
        if (tab === state.activeTab) {
          btn.className = "nav-tab shrink-0 px-3 py-1.5 rounded-xl text-xs font-black bg-amber-400 text-slate-950 transition cursor-pointer";
        } else {
          btn.className = "nav-tab shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold bg-white/10 text-slate-200 hover:bg-white/20 transition cursor-pointer";
        }
      });
    }

    function updateProgressBar() {
      const isQuizActive = state.activeTab === "weekly" && state.quizView === "quiz";
      if (!isQuizActive) {
        progressStrip.classList.add("hidden");
        return;
      }

      progressStrip.classList.remove("hidden");
      const total = state.questions.length;
      const answered = state.questions.filter((q) => state.answers[q.id] !== undefined).length;
      const pct = total > 0 ? Math.round((answered / total) * 100) : 0;
      progressLabel.textContent = `تمت الإجابة على ${answered} من ${total}`;
      progressPct.textContent = `${pct}%`;
      progressBar.style.width = `${pct}%`;
    }

    function renderPrefAndIosStrip() {
      const savedBranch = getSavedBranch();
      const showIosTip = localStorage.getItem(HIDE_IOS_TIP_KEY) !== "1";

      return `
        <div class="clean-card rounded-2xl p-3 space-y-2">
          <div class="flex items-center justify-between gap-2">
            <label for="quick-branch-select" class="text-xs font-black text-[#071124] shrink-0">
              شعبتي المفضلة:
            </label>
            <select
              id="quick-branch-select"
              class="flex-1 max-w-[220px] px-3 py-1.5 rounded-xl border border-slate-200 bg-slate-50 text-xs font-extrabold text-slate-800 focus:outline-none focus:border-[#071124]"
            >
              ${BRANCHES_LIST.map(
                (b) => `<option value="${b.id}" ${b.id === savedBranch ? "selected" : ""}>${b.name}</option>`
              ).join("")}
            </select>
          </div>

          ${
            showIosTip
              ? `<div class="pt-2 border-t border-slate-100 flex items-center justify-between gap-2 text-[11px] text-slate-600 font-semibold">
                  <span>للآيفون: من Safari اضغط <strong>Share</strong> ثم <strong>Add to Home Screen</strong>.</span>
                  <button type="button" id="hide-ios-tip-btn" class="text-slate-400 hover:text-slate-700 font-black px-1 cursor-pointer">✕</button>
                </div>`
              : ""
          }
        </div>
      `;
    }

    function bindPrefAndIosStrip() {
      const sel = document.getElementById("quick-branch-select");
      if (sel) {
        sel.addEventListener("change", () => {
          savePreferredBranch(sel.value);
          showToast(
            sel.value === "all"
              ? "تم ضبط العرض على كل الشُعب"
              : `تم حفظ شعبتك (${getBranchName(sel.value)}) تلقائياً ✓`
          );
          render();
        });
      }

      const hideBtn = document.getElementById("hide-ios-tip-btn");
      if (hideBtn) {
        hideBtn.addEventListener("click", () => {
          localStorage.setItem(HIDE_IOS_TIP_KEY, "1");
          render();
        });
      }
    }

    function renderSectionBanner(title, desc) {
      return `
        <div class="clean-card rounded-2xl p-4 sm:p-5 bg-[#071124] text-white border-[#071124]">
          <h1 class="text-lg sm:text-xl font-black text-white">${title}</h1>
          <p class="text-xs sm:text-sm text-slate-300 mt-1 leading-relaxed">${desc}</p>
        </div>
      `;
    }

    function renderLoadingBox(text = "جاري التحميل...") {
      return `
        <div class="clean-card rounded-2xl p-7 text-center space-y-2">
          <div class="inline-block w-6 h-6 border-[3px] border-[#071124] border-t-amber-400 rounded-full animate-spin"></div>
          <p class="text-xs font-extrabold text-slate-600">${escapeHtml(text)}</p>
        </div>
      `;
    }

    // =====================================================================
    // 4. التنبيهات
    // =====================================================================
    function renderAlertsTab() {
      const list = liveStore.alerts.filter((item) => {
        if (state.alertSubject !== "all" && item.subject_id !== state.alertSubject && item.subject_id !== "all") {
          return false;
        }
        return true;
      });

      appEl.innerHTML = `
        ${renderPrefAndIosStrip()}
        ${renderSectionBanner("🔔 التنبيهات وملاحظات الدكاترة", "مواعيد المراجعات، تعديل الجداول، والنقاط المهمة أول بأول.")}

        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
          ${SUBJECTS_LIST.map(
            (s) => `
              <button
                type="button"
                data-alert-subj="${s.id}"
                class="shrink-0 px-3 py-1.5 rounded-xl text-xs font-extrabold border transition cursor-pointer ${
                  state.alertSubject === s.id
                    ? "bg-[#071124] text-white border-[#071124]"
                    : "bg-white text-slate-700 border-slate-200"
                }"
              >
                ${s.name}
              </button>
            `
          ).join("")}
        </div>

        ${
          liveStore.loading
            ? renderLoadingBox("جاري تحميل التنبيهات...")
            : list.length === 0
              ? `<div class="clean-card rounded-2xl p-6 text-center text-xs sm:text-sm font-bold text-slate-500">لا توجد تنبيهات حالياً.</div>`
              : `<div class="space-y-3">
                  ${list
                    .map(
                      (item) => `
                        <article class="clean-card rounded-2xl p-4 border-r-4 ${
                          item.is_important ? "border-r-rose-600" : "border-r-amber-400"
                        } space-y-2">
                          <div class="flex items-center justify-between gap-2 text-[11px]">
                            <div class="flex flex-wrap items-center gap-1.5">
                              ${
                                item.is_important
                                  ? `<span class="px-2 py-0.5 rounded-md font-black bg-rose-600 text-white">تنبيه هام</span>`
                                  : `<span class="px-2 py-0.5 rounded-md font-extrabold bg-amber-100 text-amber-950">ملاحظة</span>`
                              }
                              <span class="px-2 py-0.5 rounded-md font-bold bg-slate-100 text-slate-700">
                                ${escapeHtml(getSubjectName(item.subject_id || "all"))}
                              </span>
                            </div>
                            <span class="font-bold text-slate-400 shrink-0">${escapeHtml(item.display_date || "")}</span>
                          </div>

                          <h2 class="text-sm sm:text-base font-black text-[#071124]">${escapeHtml(item.title)}</h2>
                          <p class="text-xs sm:text-sm text-slate-700 leading-relaxed whitespace-pre-line">${escapeHtml(item.details)}</p>
                        </article>
                      `
                    )
                    .join("")}
                </div>`
        }
      `;

      bindPrefAndIosStrip();
      document.querySelectorAll("[data-alert-subj]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.alertSubject = btn.getAttribute("data-alert-subj");
          render();
        });
      });
    }

    // =====================================================================
    // 5. ملخصات المحاضرات
    // =====================================================================
    function renderLecturesTab() {
      const list = liveStore.lectures.filter((lec) => {
        if (state.lectureSubject !== "all" && lec.subject_id !== state.lectureSubject) return false;
        if (state.lectureBranch !== "all" && lec.branch && lec.branch !== "all" && lec.branch !== state.lectureBranch) {
          return false;
        }
        return true;
      });

      appEl.innerHTML = `
        ${renderPrefAndIosStrip()}
        ${renderSectionBanner("📚 ملخصات المحاضرات", "ملخصات مرتبة حسب المادة والشعبة ليسهل الوصول إليها.")}

        <div class="clean-card rounded-2xl p-3.5 space-y-3">
          <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
            ${SUBJECTS_LIST.map(
              (s) => `
                <button
                  type="button"
                  data-lec-subj="${s.id}"
                  class="shrink-0 px-3 py-1.5 rounded-xl text-xs font-extrabold border transition cursor-pointer ${
                    state.lectureSubject === s.id
                      ? "bg-[#071124] text-white border-[#071124]"
                      : "bg-slate-50 text-slate-700 border-slate-200"
                  }"
                >
                  ${s.name}
                </button>
              `
            ).join("")}
          </div>

          <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pt-2 border-t border-slate-100">
            ${BRANCHES_LIST.map(
              (b) => `
                <button
                  type="button"
                  data-lec-branch="${b.id}"
                  class="shrink-0 px-3 py-1 rounded-xl text-xs font-extrabold border transition cursor-pointer ${
                    state.lectureBranch === b.id
                      ? "bg-amber-400 text-slate-950 border-amber-500"
                      : "bg-white text-slate-600 border-slate-200"
                  }"
                >
                  ${b.name}
                </button>
              `
            ).join("")}
          </div>
        </div>

        ${
          liveStore.loading
            ? renderLoadingBox("جاري تحميل المحاضرات...")
            : list.length === 0

    // =====================================================================
    // 8. صفحة إغلاق الميدتيرم والعدّ التنازلي للفاينل (2 / 1 / 2027)
    // =====================================================================
    function getCountdownParts() {
      const target = new Date(FINALS_DATE_ISO);
      const diff = target.getTime() - Date.now();
      if (diff <= 0) {
        return { expired: true, days: 0, hours: 0, minutes: 0, seconds: 0 };
      }
      const totalSeconds = Math.floor(diff / 1000);
      return {
        expired: false,
        days: Math.floor(totalSeconds / 86400),
        hours: Math.floor((totalSeconds % 86400) / 3600),
        minutes: Math.floor((totalSeconds % 3600) / 60),
        seconds: totalSeconds % 60
      };
    }

    function pad2(n) {
      return String(n).padStart(2, "0");
    }

    function updateCountdownDOM() {
      const c = getCountdownParts();
      const dEl = document.getElementById("cd-days");
      const hEl = document.getElementById("cd-hours");
      const mEl = document.getElementById("cd-minutes");
      const sEl = document.getElementById("cd-seconds");
      const statusEl = document.getElementById("cd-status");

      if (dEl) dEl.textContent = pad2(c.days);
      if (hEl) hEl.textContent = pad2(c.hours);
      if (mEl) mEl.textContent = pad2(c.minutes);
      if (sEl) sEl.textContent = pad2(c.seconds);
      if (statusEl) {
        statusEl.textContent = c.expired
          ? "بدأ موعد امتحانات الفاينل (2 / 1 / 2027)"
          : "الموعد المقرر للفاينل حتى الآن من المعهد: 2 / 1 / 2027";
      }
    }

    // =====================================================================
    // 9. محرك حل الأسئلة والنتيجة
    // =====================================================================
    function getActiveQuizTitle() {
      const pack = liveStore.weeklyQuizzes.find((p) => p.id === state.selectedWeeklyId);
      return pack ? pack.title : "الأسئلة الأسبوعية";
    }

    function calculateResult() {
      let correct = 0;
      let wrong = 0;
      let unanswered = 0;
      const wrongIds = [];

      state.questions.forEach((q) => {
        const ans = state.answers[q.id];
        if (ans === undefined) {
          unanswered += 1;
          wrongIds.push(q.id);
        } else if (ans === q.correctAnswer) {
          correct += 1;
        } else {
          wrong += 1;
          wrongIds.push(q.id);
        }
      });

      const total = state.questions.length;
      const pct = total > 0 ? Math.round((correct / total) * 100) : 0;

      let grade = "يحتاج مراجعة";
      let gradeCls = "bg-rose-100 text-rose-800";
      if (pct >= 85) {
        grade = "امتياز";
        gradeCls = "bg-emerald-100 text-emerald-800";
      } else if (pct >= 75) {
        grade = "جيد جداً";
        gradeCls = "bg-indigo-100 text-indigo-800";
      } else if (pct >= 60) {
        grade = "جيد";
        gradeCls = "bg-amber-100 text-amber-900";
      } else if (pct >= 50) {
        grade = "مقبول";
        gradeCls = "bg-orange-100 text-orange-900";
      }

      return { correct, wrong, unanswered, total, pct, grade, gradeCls, wrongIds };
    }

    function renderQuizEngine() {
      const q = state.questions[state.currentIdx];
      if (!q) {
        state.quizView = "setup";
        render();
        return;
      }

      const quizTitle = getActiveQuizTitle();
      const total = state.questions.length;
      const chosen = state.answers[q.id];
      const isInstant = state.gradingMode === "instant";
      const isLocked = isInstant && Boolean(state.locked[q.id]);
      const letters = ["أ", "ب", "ج", "د"];

      appEl.innerHTML = `
        <div class="clean-card rounded-2xl px-4 py-2.5 flex items-center justify-between gap-2 text-xs">
          <div class="flex items-center gap-2">
            <button type="button" id="exit-quiz-btn" class="px-2.5 py-1 rounded-lg font-black bg-slate-100 text-slate-800 cursor-pointer">✕ إنهاء</button>
            <span class="font-black text-[#071124]">سؤال ${state.currentIdx + 1} / ${total}</span>
          </div>
          <button type="button" id="toggle-instant-live" class="px-2.5 py-1 rounded-lg font-extrabold border cursor-pointer ${
            isInstant ? "bg-emerald-50 text-emerald-900 border-emerald-200" : "bg-slate-50 text-slate-600 border-slate-200"
          }">
            ${isInstant ? "تصحيح فوري: مفعل" : "تصحيح فوري"}
          </button>
        </div>

        <div class="clean-card rounded-2xl p-4 sm:p-6 space-y-5">
          <div class="text-[11px] font-bold text-slate-400">${escapeHtml(quizTitle)}</div>
          <h2 class="text-sm sm:text-lg font-black text-[#071124] leading-relaxed">${escapeHtml(q.question)}</h2>

          <div class="space-y-2">
            ${q.options
              .map((opt, idx) => {
                const isSelected = chosen === opt;
                let cls = "border-slate-200 bg-white text-slate-800";
                let badge = "";

                if (isInstant && chosen !== undefined) {
                  if (opt === q.correctAnswer) {
                    cls = "border-emerald-500 bg-emerald-50 text-emerald-950";
                    badge = `<span class="text-[11px] font-black text-emerald-700">صحيح ✓</span>`;
                  } else if (isSelected) {
                    cls = "border-rose-500 bg-rose-50 text-rose-950";
                    badge = `<span class="text-[11px] font-black text-rose-700">✕</span>`;
                  } else {
                    cls = "border-slate-100 bg-slate-50 text-slate-400";
                  }
                } else if (isSelected) {
                  cls = "border-[#071124] bg-slate-50 text-[#071124]";
                  badge = `<span class="text-[11px] font-black text-[#071124]">✓</span>`;
                }

                const prefix = q.section === "mcq" ? `${letters[idx] || idx + 1} - ` : "";

                return `
                  <button
                    type="button"
                    ${isLocked ? "disabled" : ""}
                    data-choose="${encodeURIComponent(opt)}"
                    class="choice-btn w-full text-right p-3.5 rounded-xl border-2 flex items-center justify-between gap-3 ${
                      isLocked ? "cursor-not-allowed" : "cursor-pointer"
                    } ${cls}"
                  >
                    <span class="font-bold text-xs sm:text-sm">${prefix}${escapeHtml(opt)}</span>
                    ${badge}
                  </button>
                `;
              })
              .join("")}
          </div>

          ${
            isInstant && chosen !== undefined
              ? `<div class="p-3.5 rounded-xl border text-xs leading-relaxed ${
                  chosen === q.correctAnswer
                    ? "bg-emerald-50 border-emerald-200 text-emerald-950"
                    : "bg-amber-50 border-amber-200 text-amber-950"
                }">
                  <div class="font-black mb-0.5">
                    ${chosen === q.correctAnswer ? "إجابة صحيحة ✓" : `الصحيح: (${escapeHtml(q.correctAnswer)})`}
                  </div>
                  <div>${escapeHtml(q.explanation || "")}</div>
                </div>`
              : ""
          }

          <div class="pt-3 border-t border-slate-100 flex items-center justify-between gap-2">
            <button
              type="button"
              id="prev-q-btn"
              ${state.currentIdx === 0 ? "disabled" : ""}
              class="px-3.5 py-2 rounded-xl text-xs font-bold border border-slate-200 text-slate-700 disabled:opacity-40 cursor-pointer"
            >
              → السابق
            </button>

            <div class="flex items-center gap-2">
              ${
                state.currentIdx < total - 1
                  ? `<button type="button" id="next-q-btn" class="px-4 py-2 rounded-xl text-xs font-black bg-[#071124] text-white cursor-pointer">التالي ←</button>`
                  : ""
              }
              <button type="button" id="submit-exam-btn" class="px-4 py-2 rounded-xl text-xs font-black bg-emerald-600 text-white cursor-pointer">
                تسليم ✓
              </button>
            </div>
          </div>
        </div>
      `;

      document.getElementById("exit-quiz-btn").addEventListener("click", () => {
        state.quizView = "setup";
        render();
      });

      document.querySelectorAll("[data-choose]").forEach((btn) => {
        btn.addEventListener("click", () => {
          if (isInstant && state.locked[q.id]) {
            showToast("تم تثبيت إجابة هذا السؤال");
            return;
          }
          state.answers[q.id] = decodeURIComponent(btn.getAttribute("data-choose"));
          if (state.gradingMode === "instant") state.locked[q.id] = true;
          updateProgressBar();
          renderQuizEngine();
        });
      });

      document.getElementById("toggle-instant-live").addEventListener("click", () => {
        state.gradingMode = state.gradingMode === "instant" ? "end" : "instant";
        if (state.gradingMode === "instant") {
          Object.keys(state.answers).forEach((qid) => {
            state.locked[qid] = true;
          });
        }
        renderQuizEngine();
      });

      const prevBtn = document.getElementById("prev-q-btn");
      if (prevBtn) {
        prevBtn.addEventListener("click", () => {
          if (state.currentIdx > 0) {
            state.currentIdx -= 1;
            renderQuizEngine();
          }
        });
      }

      const nextBtn = document.getElementById("next-q-btn");
      if (nextBtn) {
        nextBtn.addEventListener("click", () => {
          if (state.currentIdx < total - 1) {
            state.currentIdx += 1;
            renderQuizEngine();
          }
        });
      }

      document.getElementById("submit-exam-btn").addEventListener("click", () => {
        state.resultFilter = "all";
        state.quizView = "result";
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }

    function renderResultEngine() {
      const quizTitle = getActiveQuizTitle();
      const res = calculateResult();

      const filtered = state.questions.filter((q) => {
        const ok = state.answers[q.id] === q.correctAnswer;
        if (state.resultFilter === "wrong") return !ok;
        if (state.resultFilter === "correct") return ok;
        return true;
      });

      appEl.innerHTML = `
        <div class="clean-card rounded-2xl p-5 space-y-4">
          <div class="flex items-center justify-between gap-3">
            <div>
              <span class="px-2.5 py-0.5 rounded-md text-xs font-black ${res.gradeCls}">${res.grade}</span>
              <h2 class="text-base sm:text-xl font-black text-[#071124] mt-1">${escapeHtml(quizTitle)}</h2>
            </div>
            <div class="bg-[#071124] text-white rounded-xl px-4 py-2 text-center">
              <div class="text-xl font-black text-amber-400">${res.pct}%</div>
              <div class="text-[11px] font-bold">${res.correct}/${res.total}</div>
            </div>
          </div>

          <div class="grid grid-cols-3 gap-2 text-center text-xs">
            <div class="p-2.5 rounded-xl bg-emerald-50 text-emerald-900 font-black">صحيحة: ${res.correct}</div>
            <div class="p-2.5 rounded-xl bg-rose-50 text-rose-900 font-black">خاطئة: ${res.wrong}</div>
            <div class="p-2.5 rounded-xl bg-slate-100 text-slate-700 font-black">لم تُجب: ${res.unanswered}</div>
          </div>

          <div class="flex flex-wrap gap-2 pt-2 border-t border-slate-100">
            ${
              res.wrongIds.length > 0
                ? `<button type="button" id="retry-wrong-btn" class="px-3.5 py-2 rounded-xl text-xs font-black bg-rose-100 text-rose-900 cursor-pointer">مراجعة الأخطاء (${res.wrongIds.length})</button>`
                : ""
            }
            <button type="button" id="back-to-setup-btn" class="px-4 py-2 rounded-xl text-xs font-black bg-[#071124] text-white cursor-pointer">العودة للقائمة</button>
          </div>
        </div>

        <div class="clean-card rounded-2xl p-4 sm:p-5 space-y-3">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <h3 class="text-sm font-black text-[#071124]">مراجعة الإجابات</h3>
            <div class="flex gap-1.5">
              ${[
                { id: "all", label: "الكل" },
                { id: "wrong", label: "الأخطاء" },
                { id: "correct", label: "الصحيحة" }
              ]
                .map(
                  (t) => `<button type="button" data-rfilter="${t.id}" class="px-2.5 py-1 rounded-lg text-xs font-extrabold border cursor-pointer ${
                    state.resultFilter === t.id ? "bg-[#071124] text-white border-[#071124]" : "bg-slate-50 text-slate-700 border-slate-200"
                  }">${t.label}</button>`
                )
                .join("")}
            </div>
          </div>

          <div class="space-y-2.5">
            ${filtered
              .map((q) => {
                const userAns = state.answers[q.id];
                const ok = userAns === q.correctAnswer;
                return `
                  <div class="p-3.5 rounded-xl border ${ok ? "border-emerald-200 bg-emerald-50/30" : "border-rose-200 bg-rose-50/30"} space-y-1.5 text-xs">
                    <div class="font-black text-[#071124]">${escapeHtml(q.question)}</div>
                    <div class="font-bold">إجابتك: <span class="${ok ? "text-emerald-700" : "text-rose-700"}">${userAns !== undefined ? escapeHtml(userAns) : "لم يتم الاختيار"}</span></div>
                    <div class="font-bold text-emerald-800">الإجابة الصحيحة: ${escapeHtml(q.correctAnswer)}</div>
                    ${q.explanation ? `<div class="text-slate-600 pt-1 border-t border-slate-200/60">${escapeHtml(q.explanation)}</div>` : ""}
                  </div>
                `;
              })
              .join("")}
          </div>
        </div>
      `;

      const retryWrongBtn = document.getElementById("retry-wrong-btn");
      if (retryWrongBtn) {
        retryWrongBtn.addEventListener("click", () => {
          const wrongSet = new Set(res.wrongIds);
          state.questions = state.questions.filter((q) => wrongSet.has(q.id));
          state.currentIdx = 0;
          state.answers = {};
          state.locked = {};
          state.quizView = "quiz";
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      }

      document.getElementById("back-to-setup-btn").addEventListener("click", () => {
        state.quizView = "setup";
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      document.querySelectorAll("[data-rfilter]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.resultFilter = btn.getAttribute("data-rfilter");
          renderResultEngine();
        });
      });
    }

    // =====================================================================
    // 10. التشغيل الرئيسي
    // =====================================================================
    function render() {
      updateNavTabs();
      updateProgressBar();

      if (state.activeTab === "alerts") {
        renderAlertsTab();
      } else if (state.activeTab === "lectures") {
        renderLecturesTab();
      } else if (state.activeTab === "assignments") {
        renderAssignmentsTab();
      } else if (state.activeTab === "weekly") {
        if (state.quizView === "quiz") renderQuizEngine();
        else if (state.quizView === "result") renderResultEngine();
        else renderWeeklySetup();
      } else if (state.activeTab === "midterm") {
        renderFinalsClosedCard();
        updateCountdownDOM();
      }
    }

    document.querySelectorAll(".nav-tab").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.activeTab = btn.getAttribute("data-tab");
        state.quizView = "setup";
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });

    document.getElementById("refresh-db-btn").addEventListener("click", () => {
      loadFromSupabase(true);
    });

    document.getElementById("toast-close").addEventListener("click", () => {
      document.getElementById("toast-box").classList.add("hidden");
    });

    loadFromSupabase(false);
    setInterval(updateCountdownDOM, 1000);
  </script>
</body>
</html>
